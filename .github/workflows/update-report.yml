name: Update Tarkov PvE Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/update-report.yml"
      - "scripts/calculate-report.mjs"

permissions:
  contents: write

concurrency:
  group: tarkov-pve-report-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Inspect trader price and flea shapes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const get = async (name) => (await (await fetch(`https://json.tarkov.dev/pve/${name}`)).json()).data;
          const [itemsData, tradersData, hideoutData, bartersData] = await Promise.all([get('items'), get('traders'), get('hideout'), get('barters')]);
          const recs = v => Array.isArray(v) ? v : Object.values(v ?? {}).filter(x => x && typeof x === 'object');
          const items = recs(itemsData?.items ?? itemsData);
          const traders = recs(tradersData);
          const hideout = recs(hideoutData);
          const barters = recs(bartersData);
          const buy = items.find(i => Array.isArray(i.buyFromTrader) && i.buyFromTrader.length);
          const sell = items.find(i => Array.isArray(i.sellToTrader) && i.sellToTrader.length);
          console.log('BUY_FROM_TRADER_SAMPLE', JSON.stringify(buy ?? null, null, 2).slice(0, 16000));
          console.log('SELL_TO_TRADER_SAMPLE', JSON.stringify(sell ?? null, null, 2).slice(0, 16000));
          console.log('FLEA_MARKET', JSON.stringify(itemsData?.fleaMarket ?? null, null, 2));
          console.log('TRADERS', JSON.stringify(traders.map(t => ({id:t.id,name:t.name,normalizedName:t.normalizedName})), null, 2));
          console.log('STATIONS', JSON.stringify(hideout.map(s => ({id:s.id,name:s.name,normalizedName:s.normalizedName})), null, 2));
          const taskBarter = barters.find(b => b.taskUnlock);
          console.log('TASK_BARTER_SAMPLE', JSON.stringify(taskBarter ?? null, null, 2).slice(0, 12000));
          NODE

      - name: Calculate latest PvE report directly from Tarkov.dev
        run: node scripts/calculate-report.mjs

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/report.txt
          test -s data/report.json
          test -s data/integrity.json
          jq -e '.metadata.mode == "PvE"' data/report.json >/dev/null
          jq -e '.counts.authoritativeCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.hideoutCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.check == true' data/report.json >/dev/null

      - name: Commit updated report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.txt data/report.json data/integrity.json
          if git diff --cached --quiet; then echo "No report changes."; exit 0; fi
          git commit -m "Update Tarkov PvE report"
          git push
