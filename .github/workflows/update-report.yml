name: Update Tarkov PvE Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/update-report.yml"
      - "scripts/calculate-report.mjs"
      - "scripts/calculate-special-systems.mjs"

permissions:
  contents: write

concurrency:
  group: tarkov-pve-report-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Calculate latest PvE report directly from Tarkov.dev
        run: node scripts/calculate-report.mjs

      - name: Calculate special hideout systems
        run: node scripts/calculate-special-systems.mjs

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/report.txt
          test -s data/report.json
          test -s data/crafts.json
          test -s data/integrity.json
          test -s data/special-systems.json

          jq -e '.metadata.mode == "PvE"' data/report.json >/dev/null
          jq -e '.counts.crafts > 0' data/report.json >/dev/null
          jq -e '.counts.check == true' data/report.json >/dev/null
          jq -e '.integrity.countMatch == true' data/integrity.json >/dev/null
          jq -e '.integrity.unresolvedStationCrafts == 0' data/integrity.json >/dev/null
          jq -e '.integrity.missingReferencedItems == 0' data/integrity.json >/dev/null

          jq -e '.bitcoinFarm.status == "complete"' data/special-systems.json >/dev/null
          jq -e '.bitcoinFarm.variants | length == 4' data/special-systems.json >/dev/null
          jq -e '.scavCase.options | length == 5' data/special-systems.json >/dev/null
          jq -e '.fuel.cheapest != null' data/special-systems.json >/dev/null
          jq -e '.continuousProduction.waterCollector.scannedCompleteCrafts > 0' data/special-systems.json >/dev/null
          jq -e '.continuousProduction.boozeGenerator.scannedCompleteCrafts > 0' data/special-systems.json >/dev/null

          crafts=$(jq '.counts.crafts' data/report.json)
          calculated=$(jq 'length' data/crafts.json)
          test "$crafts" -eq "$calculated"

      - name: Commit updated report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.txt data/report.json data/crafts.json data/integrity.json data/special-systems.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Update Tarkov PvE report"
          git push
