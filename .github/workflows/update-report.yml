name: Update Tarkov PvE Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/update-report.yml"
      - "scripts/calculate-report.mjs"

permissions:
  contents: write

concurrency:
  group: tarkov-pve-report-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Inspect current hideout JSON shape
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch('https://json.tarkov.dev/pve/hideout');
          const envelope = await r.json();
          const data = envelope.data;
          const type = Array.isArray(data) ? 'array' : typeof data;
          console.log('hideout data type:', type);
          console.log('hideout top keys:', data && typeof data === 'object' ? Object.keys(data).slice(0, 20) : []);
          const values = Array.isArray(data) ? data : (data && typeof data === 'object' ? Object.values(data) : []);
          const first = values.find(v => v && typeof v === 'object' && !Array.isArray(v));
          console.log('first record keys:', first ? Object.keys(first) : []);
          console.log('first record:', JSON.stringify(first, null, 2).slice(0, 12000));
          NODE

      - name: Calculate latest PvE report directly from Tarkov.dev
        run: node scripts/calculate-report.mjs

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail

          test -s data/report.txt
          test -s data/report.json
          test -s data/integrity.json

          jq -e '.metadata.mode == "PvE"' data/report.json >/dev/null
          jq -e '.counts.authoritativeCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.hideoutCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.check == true' data/report.json >/dev/null
          jq -e '.integrity.countMatch == true' data/integrity.json >/dev/null
          jq -e '.integrity.missingCraftIdsFromHideout == 0' data/integrity.json >/dev/null
          jq -e '.integrity.extraCraftIdsInHideout == 0' data/integrity.json >/dev/null

      - name: Commit updated report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/report.txt data/report.json data/integrity.json

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Update Tarkov PvE report"
          git push
