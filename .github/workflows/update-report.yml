name: Update Tarkov PvE Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/update-report.yml"
      - "scripts/calculate-report.mjs"

permissions:
  contents: write

concurrency:
  group: tarkov-pve-report-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Inspect Tarkov economy JSON shapes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const get = async (name) => (await (await fetch(`https://json.tarkov.dev/pve/${name}`)).json()).data;
          const [craftsData, bartersData, itemsData, tradersData, hideoutData] = await Promise.all([
            get('crafts'), get('barters'), get('items'), get('traders'), get('hideout')
          ]);
          const recs = v => Array.isArray(v) ? v : Object.values(v ?? {}).filter(x => x && typeof x === 'object');
          const crafts = recs(craftsData);
          const barters = recs(bartersData);
          const items = recs(itemsData?.items ?? itemsData);
          const traders = recs(tradersData);
          const hideout = recs(hideoutData);
          console.log('COUNTS', { crafts: crafts.length, barters: barters.length, items: items.length, traders: traders.length, hideout: hideout.length });
          console.log('FIRST_CRAFT', JSON.stringify(crafts[0], null, 2).slice(0, 12000));
          console.log('FIRST_BARTER_KEYS', Object.keys(barters[0] ?? {}));
          console.log('FIRST_BARTER', JSON.stringify(barters[0], null, 2).slice(0, 12000));
          const currencyIds = new Set(['5449016a4bdc2d6f028b456f','5696686a4bdc2da3298b456a','569668774bdc2da2298b4568']);
          const currencyBarters = barters.filter(b => (b.requiredItems ?? []).some(x => currencyIds.has(typeof x.item === 'string' ? x.item : x.item?.id)));
          console.log('CURRENCY_BARTERS_SAMPLE', JSON.stringify(currencyBarters.slice(0, 5), null, 2).slice(0, 20000));
          console.log('FIRST_ITEM_KEYS', Object.keys(items[0] ?? {}));
          const withTraderPrices = items.find(i => Array.isArray(i.traderPrices) && i.traderPrices.length);
          console.log('ITEM_WITH_TRADER_PRICES', JSON.stringify(withTraderPrices, null, 2).slice(0, 16000));
          console.log('FLEA_MARKET', JSON.stringify(itemsData?.fleaMarket ?? null, null, 2));
          console.log('TRADER_SAMPLE', JSON.stringify(traders.slice(0, 3), null, 2).slice(0, 12000));
          console.log('STATION_SAMPLE', JSON.stringify(hideout.filter(s => ['workbench','lavatory','nutrition-unit','medstation','intelligence-center','booze-generator','water-collector'].includes(s.normalizedName)).map(s => ({id:s.id,name:s.name,normalizedName:s.normalizedName})), null, 2));
          NODE

      - name: Calculate latest PvE report directly from Tarkov.dev
        run: node scripts/calculate-report.mjs

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/report.txt
          test -s data/report.json
          test -s data/integrity.json
          jq -e '.metadata.mode == "PvE"' data/report.json >/dev/null
          jq -e '.counts.authoritativeCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.hideoutCrafts > 0' data/report.json >/dev/null
          jq -e '.counts.check == true' data/report.json >/dev/null

      - name: Commit updated report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.txt data/report.json data/integrity.json
          if git diff --cached --quiet; then echo "No report changes."; exit 0; fi
          git commit -m "Update Tarkov PvE report"
          git push
